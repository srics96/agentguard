# AgentGuard standing policy. Signed with signing.py; the guard refuses to load
# it if the signature does not match. The agent and task instructions can never
# widen this; only a re-signed file can.
on_violation: kill

global:
  # Secrets the agent must never see in page text, and never send anywhere.
  never_see:   [api_key, ssh_credential, password, card_number, bank_account, passport, phone, protected]
  never_share: [api_key, ssh_credential, password, card_number, bank_account, passport, phone, protected]
  # Destructive / money-moving actions are denied everywhere by default.
  deny:        [transfer, add_payee, delete]

categories:
  bank:
    # Showcase: "let the agent read balances, never move money, and let nothing
    # read here leave to anywhere but the bank itself."
    domains: ["*.chase.com", "*.bankofamerica.com", "*.wellsfargo.com", "*.wealthfront.com"]
    deny:         [transfer, add_payee, account_change, purchase, edit_file]
    taint_reads:  true
    allow_sinks:  ["*.chase.com", "*.bankofamerica.com", "*.wellsfargo.com", "*.wealthfront.com"]
  email:
    domains: ["*.novamail.com", "mail.google.com", "*.gmail.com"]
    # Sending mail is allowed, but forwarding anything read here off-domain is
    # caught by taint, and phishing links are held.
    deny:                [delete]
    taint_reads:         true
    allow_sinks:         ["mail.google.com", "*.gmail.com", "*.novamail.com"]
    deny_outbound_links: true
    allow_link_domains:  ["mail.google.com", "*.gmail.com", "*.novamail.com"]
  shopping:
    domains: ["*.amazon.com", "*.booking.com"]
    approve: [purchase]

unknown_sites:
  # Benchmark pages are served from localhost and are 'unknown' category.
  # Strict posture for unknown sites: destructive actions denied, data read
  # here is tainted and may not leave, and outbound links are held.
  deny:                [transfer, add_payee, delete, account_change, edit_file]
  taint_reads:         true
  allow_sinks:         []
  deny_outbound_links: true
  allow_link_domains:  []
